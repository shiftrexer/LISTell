<!doctype html><html lang="ja"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/><meta name="theme-color" content="#000000"/><meta name="apple-mobile-web-app-capable" content="yes"/><meta name="apple-mobile-web-app-status-bar-style" content="black"/><meta name="apple-mobile-web-app-title" content="LISTell"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-v2.png"/><link rel="manifest" href="/manifest.webmanifest"/><link rel="preload" href="/splash-dog.webp" as="image" type="image/webp"/><title>LISTell</title><style>html,body{margin:0;width:100%;height:100%;background:#000}#launch-splash{position:fixed;z-index:99999;inset:0;width:100vw;height:100dvh;background:#000;opacity:1}#launch-splash img{position:absolute;display:block;width:min(30vw,150px);height:auto;left:50%;top:50%;transform:translate(-50%,-50%);opacity:0;transition:opacity 1s ease}#launch-splash img.fade-in{opacity:1}#launch-splash img.fade-away{opacity:0}</style><script type="module" src="/src/main.js"></script></head><body><div id="launch-splash"><img id="launch-splash-img" src="/splash-dog.webp" alt="" width="150" height="150"></div><div id="app"></div><script>(()=>{const splash=document.getElementById('launch-splash');const img=document.getElementById('launch-splash-img');let started=false;const start=()=>{if(started)return;started=true;setTimeout(()=>img.classList.add('fade-in'),1000);setTimeout(()=>{img.classList.remove('fade-in');img.classList.add('fade-away')},4000);setTimeout(()=>splash?.remove(),5000)};if(img.complete)start();else{img.addEventListener('load',start,{once:true});img.addEventListener('error',start,{once:true})}})();</script></body></html>
