name: CI

on:
  push:
    branches: [main, rebuild-listell]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Validate D1 migrations with SQLite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y sqlite3
          rm -f /tmp/listell.db
          for migration in migrations/*.sql; do
            echo "Applying $migration"
            sqlite3 /tmp/listell.db < "$migration"
          done
          violations="$(sqlite3 /tmp/listell.db 'PRAGMA foreign_key_check;')"
          if [ -n "$violations" ]; then
            echo "$violations"
            exit 1
          fi
